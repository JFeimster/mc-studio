<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Broker Profile</title>
  <style>
    :root {
      --text: #f5f7fb;
      --muted: #aeb7c4;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.12);
      --panel: rgba(10, 16, 28, 0.82);
      --panel-soft: rgba(14, 22, 36, 0.72);
      --accent: #e5c14d;
      --accent-2: #8fb3ff;
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .page {
      width: 100%;
      padding: 18px;
    }

    .shell {
      width: min(var(--max), 100%);
      margin: 0 auto;
      padding: 22px;
      border-radius: 34px;
      background:
        radial-gradient(circle at top left, rgba(229, 193, 77, 0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(143, 179, 255, 0.12), transparent 24%),
        linear-gradient(180deg, rgba(6, 10, 18, 0.96) 0%, rgba(8, 13, 22, 0.98) 100%);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(12px);
    }

    .hero {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 22px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .hero.single {
      grid-template-columns: minmax(0, 1fr);
    }

    .photoCard {
      min-height: 350px;
      overflow: hidden;
    }

    .photo {
      width: 100%;
      height: 100%;
      min-height: 350px;
      object-fit: cover;
    }

    .photoFallback {
      min-height: 350px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(229, 193, 77, 0.15), transparent 26%),
        radial-gradient(circle at 80% 20%, rgba(143, 179, 255, 0.12), transparent 24%),
        linear-gradient(180deg, rgba(12,18,30,0.96), rgba(7,11,20,0.98));
    }

    .monogram {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(255,255,255,0.04);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .heroBody {
      padding: 28px;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      display: inline-flex;
      align-self: flex-start;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(229, 193, 77, 0.25);
      background: rgba(229, 193, 77, 0.08);
      color: #f1d36f;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 5vw, 64px);
      line-height: 0.94;
      letter-spacing: -0.055em;
      max-width: 11ch;
    }

    .sub {
      margin: 0;
      max-width: 64ch;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.65;
    }

    .metaRow {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .metaChip {
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: #e5eaf0;
      font-size: 13px;
      font-weight: 700;
    }

    .ctaRow {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      padding: 14px 18px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 15px;
      line-height: 1;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn.primary {
      background: linear-gradient(135deg, #e5c14d, #f5da77);
      color: #111;
      box-shadow: 0 14px 28px rgba(229, 193, 77, 0.22);
    }

    .btn.secondary,
    .btn.ghost {
      color: #f5f7fb;
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--line-strong);
    }

    .infoGrid,
    .contentGrid,
    .stack {
      display: grid;
      gap: 18px;
      margin-bottom: 18px;
    }

    .infoGrid {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }

    .contentGrid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .section,
    .infoCard,
    .tagSection,
    .footerCta {
      padding: 24px;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      color: #8993a2;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-weight: 800;
    }

    .value {
      color: #eef2f8;
      font-size: 15px;
      line-height: 1.55;
      word-break: break-word;
    }

    .section h2,
    .tagSection h2,
    .footerCta h2 {
      margin: 0 0 12px;
      letter-spacing: -0.04em;
    }

    .section h2,
    .tagSection h2 {
      font-size: 24px;
    }

    .footerCta h2 {
      font-size: 30px;
    }

    .section p,
    .footerCta p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
      white-space: pre-line;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      padding: 10px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: #eef2f8;
      font-size: 14px;
      font-weight: 700;
    }

    .resourceGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }

    .resourceCard {
      height: 100%;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.02);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .resourceTitle {
      font-size: 16px;
      font-weight: 800;
      color: #f2f6fb;
      line-height: 1.35;
    }

    .resourceDescription {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .footerCta {
      text-align: center;
    }

    .footerCta p {
      max-width: 760px;
      margin: 0 auto;
    }

    .footerCta .ctaRow {
      justify-content: center;
    }

    .hidden { display: none !important; }

    @media (max-width: 980px) {
      .hero,
      .contentGrid {
        grid-template-columns: 1fr;
      }

      .heroBody,
      .photoCard,
      .photo,
      .photoFallback {
        min-height: unset;
      }

      h1 { max-width: 13ch; }
    }

    @media (max-width: 640px) {
      .page { padding: 10px; }
      .shell { padding: 14px; border-radius: 24px; }
      .heroBody,
      .section,
      .infoCard,
      .tagSection,
      .footerCta { padding: 18px; }
      h1 { font-size: 42px; }
      .sub { font-size: 16px; }
      .resourceGrid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="shell">
      <div id="app"></div>
    </div>
  </div>

  <script>
    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function visible(value) {
      if (Array.isArray(value)) return value.length > 0;
      return !!(value && String(value).trim());
    }

    function locationLine(city, state) {
      return [city, state].filter(Boolean).join(', ');
    }

    function initials(name = '') {
      return name
        .split(' ')
        .map((part) => part[0])
        .filter(Boolean)
        .slice(0, 2)
        .join('')
        .toUpperCase() || 'MC';
    }

    function renderTags(items = []) {
      if (!items.length) return '';
      return `<div class="tags">${items.map((item) => `<span class="tag">${escapeHtml(item)}</span>`).join('')}</div>`;
    }

    function renderResources(items = []) {
      if (!items.length) return '';
      return `
        <div class="resourceGrid">
          ${items.map((item) => `
            <div class="resourceCard">
              <div>
                <div class="resourceTitle">${escapeHtml(item.title || 'Resource')}</div>
                ${item.description ? `<div class="resourceDescription">${escapeHtml(item.description)}</div>` : ''}
              </div>
              ${item.url ? `<button class="btn ghost" data-url="${escapeHtml(item.url)}">${escapeHtml(item.buttonText || 'Open Resource')}</button>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    function sectionHidden(value) {
      return visible(value) ? '' : 'hidden';
    }

    function button(label, url, cls) {
      if (!url) return '';
      return `<button class="btn ${cls}" data-url="${escapeHtml(url)}">${escapeHtml(label)}</button>`;
    }

    function render(data) {
      const app = document.getElementById('app');
      const hasImage = !!data.profileImage;

      app.innerHTML = `
        <section class="hero ${hasImage ? '' : 'single'}">
          ${hasImage ? `
            <div class="card photoCard">
              <img class="photo" src="${escapeHtml(data.profileImage)}" alt="${escapeHtml(data.fullName)}">
            </div>
          ` : ''}

          <div class="card heroBody">
            <div class="eyebrow">Moonshine Capital Broker</div>
            ${hasImage ? '' : `<div class="monogram">${escapeHtml(initials(data.fullName))}</div>`}
            <h1>${escapeHtml(data.heroHeadline || '')}</h1>
            <p class="sub">${escapeHtml(data.heroSubheadline || '')}</p>

            <div class="metaRow">
              ${visible(data.fullName) ? `<span class="metaChip">${escapeHtml(data.fullName)}</span>` : ''}
              ${visible(data.partnerTagline) ? `<span class="metaChip">${escapeHtml(data.partnerTagline)}</span>` : ''}
              ${visible(data.agencyName) ? `<span class="metaChip">${escapeHtml(data.agencyName)}</span>` : ''}
            </div>

            <div class="ctaRow">
              ${button('Apply Now', data.applicationUrl, 'primary')}
              ${button('Book a Call', data.calendarUrl, 'secondary')}
            </div>
          </div>
        </section>

        <section class="infoGrid">
          <div class="card infoCard ${sectionHidden(data.agencyName)}">
            <span class="label">Agency</span>
            <div class="value">${escapeHtml(data.agencyName || '')}</div>
          </div>

          <div class="card infoCard ${sectionHidden(locationLine(data.city, data.state))}">
            <span class="label">Location</span>
            <div class="value">${escapeHtml(locationLine(data.city, data.state))}</div>
          </div>

          <div class="card infoCard ${sectionHidden(data.publicEmail)}">
            <span class="label">Email</span>
            <div class="value">${escapeHtml(data.publicEmail || '')}</div>
          </div>

          <div class="card infoCard ${sectionHidden(data.directPhone)}">
            <span class="label">Phone</span>
            <div class="value">${escapeHtml(data.directPhone || '')}</div>
          </div>
        </section>

        <section class="contentGrid">
          <div class="card section ${sectionHidden(data.shortBio)}">
            <h2>About ${escapeHtml(data.fullName || 'This Broker')}</h2>
            <p>${escapeHtml(data.shortBio || '')}</p>
          </div>

          <div class="card section ${sectionHidden(data.whyChooseYou)}">
            <h2>Why Work With Me</h2>
            <p>${escapeHtml(data.whyChooseYou || '')}</p>
          </div>
        </section>

        <section class="stack">
          <div class="card tagSection ${sectionHidden(data.targetAudience)}">
            <h2>Who I Help</h2>
            ${renderTags(data.targetAudience || [])}
          </div>

          <div class="card tagSection ${sectionHidden(data.fundingSpecialties)}">
            <h2>Funding Lanes I Commonly Discuss</h2>
            ${renderTags(data.fundingSpecialties || [])}
          </div>

          <div class="card tagSection ${sectionHidden(data.featuredResources)}">
            <h2>Helpful Tools & Resources</h2>
            ${renderResources(data.featuredResources || [])}
          </div>
        </section>

        <section class="card footerCta">
          <h2>Ready to Take the Next Step?</h2>
          <p>Start with the application or book a conversation to figure out which path makes the most sense.</p>
          <div class="ctaRow">
            ${button('Start Application', data.applicationUrl, 'primary')}
            ${button('Schedule a Call', data.calendarUrl, 'secondary')}
          </div>
        </section>
      `;

      document.querySelectorAll('[data-url]').forEach((button) => {
        button.addEventListener('click', () => {
          const url = button.getAttribute('data-url');
          window.parent.postMessage({ type: 'openLink', url }, '*');
        });
      });

      sendHeight();
      setTimeout(sendHeight, 100);
      setTimeout(sendHeight, 400);
      setTimeout(sendHeight, 1000);

      document.querySelectorAll('img').forEach((img) => {
        img.addEventListener('load', sendHeight);
      });
    }

    function sendHeight() {
      const shell = document.querySelector('.shell');
      const height = Math.max(
        document.documentElement.scrollHeight || 0,
        document.body.scrollHeight || 0,
        shell ? shell.scrollHeight + 40 : 0,
        1200
      );

      window.parent.postMessage({ type: 'resize', height }, '*');
    }

    const resizeObserver = new ResizeObserver(() => sendHeight());
    resizeObserver.observe(document.body);

    const mutationObserver = new MutationObserver(() => sendHeight());
    mutationObserver.observe(document.body, { childList: true, subtree: true, attributes: true });

    window.addEventListener('resize', sendHeight);

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'partnerData' && data.payload) {
        render(data.payload);
      }
    });
  </script>
</body>
</html>
