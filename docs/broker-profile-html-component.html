<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Broker Profile</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #11151b;
      --text: #f5f7fb;
      --muted: #a8b1bd;
      --line: rgba(255, 255, 255, 0.08);
      --accent: #d4af37;
      --accent2: #8fb3ff;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      --radius: 24px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at top left, rgba(212, 175, 55, 0.10), transparent 32%),
        radial-gradient(circle at top right, rgba(143, 179, 255, 0.08), transparent 28%),
        linear-gradient(180deg, #090b0e 0%, #0d1015 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .wrap {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 28px;
      align-items: stretch;
      margin-bottom: 22px;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .photoCard {
      min-height: 420px;
      position: relative;
    }

    .photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      min-height: 420px;
    }

    .photoFallback {
      height: 100%;
      min-height: 420px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -0.04em;
      background:
        radial-gradient(circle at 20% 20%, rgba(212,175,55,.18), transparent 26%),
        radial-gradient(circle at 80% 20%, rgba(143,179,255,.15), transparent 22%),
        linear-gradient(180deg, #131922 0%, #0d1015 100%);
    }

    .heroBody {
      padding: 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 420px;
    }

    .eyebrow {
      display: inline-flex;
      align-self: flex-start;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(212,175,55,.28);
      background: rgba(212,175,55,.08);
      color: #f3d57d;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 0.98;
      letter-spacing: -0.045em;
      max-width: 14ch;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
      max-width: 60ch;
    }

    .partnerMeta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 20px;
      color: #d8dee7;
      font-size: 14px;
    }

    .metaChip {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
    }

    .ctaRow {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 28px;
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      padding: 14px 18px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 15px;
      transition: 0.18s ease;
    }

    .btn.primary {
      background: linear-gradient(135deg, #d4af37, #f3d57d);
      color: #111;
      box-shadow: 0 14px 30px rgba(212,175,55,0.22);
    }

    .btn.secondary,
    .btn.ghost {
      background: #171c23;
      color: #f5f7fb;
      border: 1px solid var(--line);
    }

    .trustBar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin: 0 0 22px;
    }

    .trustItem,
    .section,
    .tagSection,
    .footerCta {
      padding: 28px;
    }

    .label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8f98a5;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .value {
      color: #eef2f8;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-bottom: 22px;
    }

    .section h2,
    .tagSection h2 {
      margin: 0 0 14px;
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    .section p,
    .footerCta p {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
      white-space: pre-line;
    }

    .stack {
      display: grid;
      gap: 22px;
      margin-bottom: 22px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: #eef2f8;
      font-size: 14px;
      font-weight: 700;
    }

    .resourceGrid {
      display: grid;
      gap: 12px;
    }

    .resourceCard {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.025);
    }

    .resourceTitle {
      font-size: 16px;
      font-weight: 800;
      color: #f2f6fb;
      margin-bottom: 10px;
    }

    .resourceDescription {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .footerCta {
      text-align: center;
    }

    .footerCta h2 {
      margin: 0 0 10px;
      font-size: 34px;
      letter-spacing: -0.04em;
    }

    .hidden { display: none !important; }

    @media (max-width: 980px) {
      .hero { grid-template-columns: 1fr; }
      .trustBar { grid-template-columns: 1fr 1fr; }
      .grid2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .wrap { width: min(var(--max), calc(100% - 20px)); padding-top: 20px; }
      .trustBar { grid-template-columns: 1fr; }
      h1 { font-size: 38px; }
      .sub { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <script>
    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function visible(value) {
      if (Array.isArray(value)) return value.length > 0;
      return !!(value && String(value).trim());
    }

    function locationLine(city, state) {
      return [city, state].filter(Boolean).join(', ');
    }

    function initials(name = '') {
      return name
        .split(' ')
        .map((part) => part[0])
        .filter(Boolean)
        .slice(0, 2)
        .join('')
        .toUpperCase() || 'MC';
    }

    function renderTags(items = []) {
      if (!items.length) return '';
      return `
        <div class="tags">
          ${items.map((item) => `<span class="tag">${escapeHtml(item)}</span>`).join('')}
        </div>
      `;
    }

    function renderResources(items = []) {
      if (!items.length) return '';

      return `
        <div class="resourceGrid">
          ${items.map((item) => `
            <div class="resourceCard">
              <div class="resourceTitle">${escapeHtml(item.title || 'Resource')}</div>
              ${item.description ? `<div class="resourceDescription">${escapeHtml(item.description)}</div>` : ''}
              ${item.url ? `<button class="btn ghost" data-url="${escapeHtml(item.url)}">${escapeHtml(item.buttonText || 'Open Resource')}</button>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    function sectionHidden(value) {
      return visible(value) ? '' : 'hidden';
    }

    function button(label, url, cls) {
      if (!url) return '';
      return `<button class="btn ${cls}" data-url="${escapeHtml(url)}">${escapeHtml(label)}</button>`;
    }

    function render(data) {
      const app = document.getElementById('app');

      app.innerHTML = `
        <section class="hero">
          <div class="card photoCard">
            ${data.profileImage
              ? `<img class="photo" src="${escapeHtml(data.profileImage)}" alt="${escapeHtml(data.fullName)}">`
              : `<div class="photoFallback">${escapeHtml(initials(data.fullName))}</div>`}
          </div>

          <div class="card heroBody">
            <div class="eyebrow">Moonshine Capital Broker</div>
            <h1>${escapeHtml(data.heroHeadline || '')}</h1>
            <p class="sub">${escapeHtml(data.heroSubheadline || '')}</p>

            <div class="partnerMeta">
              ${visible(data.fullName) ? `<span class="metaChip">${escapeHtml(data.fullName)}</span>` : ''}
              ${visible(data.partnerTagline) ? `<span class="metaChip">${escapeHtml(data.partnerTagline)}</span>` : ''}
              ${visible(data.agencyName) ? `<span class="metaChip">${escapeHtml(data.agencyName)}</span>` : ''}
            </div>

            <div class="ctaRow">
              ${button('Apply Now', data.applicationUrl, 'primary')}
              ${button('Book a Call', data.calendarUrl, 'secondary')}
            </div>
          </div>
        </section>

        <section class="trustBar">
          <div class="card trustItem ${sectionHidden(data.agencyName)}">
            <span class="label">Agency</span>
            <div class="value">${escapeHtml(data.agencyName || '')}</div>
          </div>

          <div class="card trustItem ${sectionHidden(locationLine(data.city, data.state))}">
            <span class="label">Location</span>
            <div class="value">${escapeHtml(locationLine(data.city, data.state))}</div>
          </div>

          <div class="card trustItem ${sectionHidden(data.publicEmail)}">
            <span class="label">Email</span>
            <div class="value">${escapeHtml(data.publicEmail || '')}</div>
          </div>

          <div class="card trustItem ${sectionHidden(data.directPhone)}">
            <span class="label">Phone</span>
            <div class="value">${escapeHtml(data.directPhone || '')}</div>
          </div>
        </section>

        <section class="grid2">
          <div class="card section ${sectionHidden(data.shortBio)}">
            <h2>About ${escapeHtml(data.fullName || 'This Broker')}</h2>
            <p>${escapeHtml(data.shortBio || '')}</p>
          </div>

          <div class="card section ${sectionHidden(data.whyChooseYou)}">
            <h2>Why Work With Me</h2>
            <p>${escapeHtml(data.whyChooseYou || '')}</p>
          </div>
        </section>

        <section class="stack">
          <div class="card tagSection ${sectionHidden(data.targetAudience)}">
            <h2>Who I Help</h2>
            ${renderTags(data.targetAudience || [])}
          </div>

          <div class="card tagSection ${sectionHidden(data.fundingSpecialties)}">
            <h2>Funding Lanes I Commonly Discuss</h2>
            ${renderTags(data.fundingSpecialties || [])}
          </div>

          <div class="card tagSection ${sectionHidden(data.featuredResources)}">
            <h2>Helpful Tools & Resources</h2>
            ${renderResources(data.featuredResources || [])}
          </div>
        </section>

        <section class="card footerCta">
          <h2>Ready to Take the Next Step?</h2>
          <p>Start with the application or book a conversation to figure out which path makes the most sense.</p>
          <div class="ctaRow" style="justify-content:center;">
            ${button('Start Application', data.applicationUrl, 'primary')}
            ${button('Schedule a Call', data.calendarUrl, 'secondary')}
          </div>
        </section>
      `;

      document.querySelectorAll('[data-url]').forEach((button) => {
        button.addEventListener('click', () => {
          const url = button.getAttribute('data-url');
          window.parent.postMessage({ type: 'openLink', url }, '*');
        });
      });

      requestAnimationFrame(() => {
        const height = document.documentElement.scrollHeight || document.body.scrollHeight || 1800;
        window.parent.postMessage({ type: 'resize', height: height + 24 }, '*');
      });
    }

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'partnerData' && data.payload) {
        render(data.payload);
      }
    });
  </script>
</body>
</html>
